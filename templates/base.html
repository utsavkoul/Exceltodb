<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %} Upload file {% endblock %}</title>
    <style>
        :root{--bg:#f6f9fc;--card:#fff;--accent:#0066cc;--accent-2:#005bb5;--muted:#6b7280}
        *{box-sizing:border-box;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
        html,body{margin:0;padding:0;min-height:100%}
        body{background:var(--bg);color:#111;min-height:100vh;display:block}
        .navbar{position:sticky;top:0;z-index:1040;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 12px rgba(15,23,42,0.06)}
        .navbar .container-fluid{padding:.75rem 1.5rem}
        .page-shell{padding:1.5rem;width:100%}
        .card{background:var(--card);padding:2rem;border-radius:12px;box-shadow:0 6px 20px rgba(16,24,40,0.08);width:100%;max-width:540px}
        form{display:flex;flex-direction:column;gap:1rem}
        input[type="file"]{padding:.6rem;border:1px dashed #d1d5db;border-radius:8px;background:#fbfdff}
        button[type="submit"], button[type="button"], a.button{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
        button[type="button"]{background:#e2e8f0;color:#111}
        h1{font-size:1.1rem;margin:0;color:var(--muted)}
        ul{padding-left:1rem}
        .table-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;width:100%;min-height:50vh;align-items:start}
        .index-table-card{max-width:none;width:100%;height:50vh;display:flex;flex-direction:column;padding:1.25rem}
        .index-table-card .card-body{flex:1;width:100%;min-height:0;display:flex;align-items:stretch}
        .index-table-card .card-body > *{width:100%;height:100%}
        @media (max-width: 768px){.table-grid{grid-template-columns:1fr}} 
    </style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" type="text/css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/canvas-datagrid"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!-- use xlsx.full.min.js from version 0.20.3 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

<nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#" style="gap: 10px; display: flex; align-items: center;">

        <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"> <i class="fa fa-bars" aria-hidden="true"></i></button>
        DataBase Merger
    </a>
  </div>
</nav>

<div>

{% block content %}{% endblock %}

</div>

</body>
</html>
