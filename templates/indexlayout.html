        /**
         * Automatically converts any pandas-style string into a custom dictionary.
         * @param {string} stringData - The raw string input.
         * @param {string} keyField - The column name you want to use as your dictionary key.
         * @returns {Object} A dynamic custom dictionary.
         */
        function toArrayOfObjects(stringData, keyField = null) {
            const parsedData =
                typeof stringData === "string"
                    ? JSON.parse(stringData)
                    : stringData;

            const columns = Object.keys(parsedData);

            if (columns.length === 0) return [];

            const rowIndexes = Object.keys(parsedData[columns[0]]);

            return rowIndexes.map(index => {
                const row = {};

                columns.forEach(col => {
                    row[col] = parsedData[col][index];
                });

                if (keyField && parsedData[keyField]) {
                    row._key = parsedData[keyField][index];
                }

                return row;
            });
        }
